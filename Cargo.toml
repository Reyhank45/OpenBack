[package]
name = "openback"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
nix = { version = "0.29", features = ["sched", "mount", "fs", "process", "signal", "user"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0.104"
libc = "0.2.189"
chrono = "0.4.45"
caps = "0.5"
