apiVersion: openback.io/v1
kind: Application
metadata:
  name: hello-world-alpine-python
spec:
  baseImage: alpine-3.20
  packages:
    apk:
      - python3
  workDir: /app
  replicas: 1
  entrypoint:
    - python3
    - -c
    - "import http.server, socketserver; print('Alpine Python Hello World serving on port 8082'); socketserver.TCPServer(('', 8082), http.server.SimpleHTTPRequestHandler).serve_forever()"
  networking:
    ipc_socket: /run/app.sock
    ports:
      - host_port: 8082
        container_socket: /run/app.sock
