apiVersion: openback.io/v1
kind: Application
metadata:
  name: hello-world-alpine-python
spec:
  baseImage: alpine-3.20
  packages:
    apk:
      - python3
  workDir: /app
  replicas: 1
  entrypoint:
    - sh
    - -c
    - |
      cat << 'INNER_EOF' > /tmp/server.py
      import socket, http.server, socketserver, os
      s = os.environ.get('OPENBACK_IPC_SOCKET', '/run/app.sock')
      if os.path.exists(s): os.remove(s)
      class H(http.server.SimpleHTTPRequestHandler):
          def address_string(self): return "unix"
          def do_GET(self):
              self.send_response(200)
              self.send_header('Content-type','text/plain')
              self.end_headers()
              self.wfile.write(b'Hello World from Alpine Python!')
      server = socketserver.UnixStreamServer(s, H)
      print('Serving on', s)
      server.serve_forever()
      INNER_EOF
      python3 -u /tmp/server.py
  networking:
    ipc_socket: /run/app.sock
    ports:
      - host_port: 8082
        container_socket: /run/app.sock
